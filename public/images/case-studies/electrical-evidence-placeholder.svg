<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <defs>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F4"/>
    </linearGradient>
    <linearGradient id="eLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="eArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF1F2" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="900" height="500" rx="20" fill="url(#eBg)" stroke="#FED7AA" stroke-width="2"/>

  <!-- Window Header / Browser Bar -->
  <rect width="900" height="56" rx="20" fill="#FFEDD5"/>
  <rect y="40" width="900" height="16" fill="#FFEDD5"/>
  <circle cx="36" cy="28" r="6" fill="#FDA4AF"/>
  <circle cx="56" cy="28" r="6" fill="#FCD34D"/>
  <circle cx="76" cy="28" r="6" fill="#86EFAC"/>
  <rect x="120" y="16" width="370" height="24" rx="12" fill="#FFFFFF" stroke="#FDE2E4"/>
  <text x="140" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2410C">Google Search Console Impressions • Under 2 Months</text>

  <rect x="710" y="16" width="150" height="24" rx="12" fill="#FEF3C7"/>
  <text x="785" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">ACTIVE CAMPAIGN (~3X)</text>

  <!-- Graph Grid Lines -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="#FFEDD5" stroke-dasharray="4 4"/>
  <line x1="80" y1="190" x2="820" y2="190" stroke="#FFEDD5" stroke-dasharray="4 4"/>
  <line x1="80" y1="260" x2="820" y2="260" stroke="#FFEDD5" stroke-dasharray="4 4"/>
  <line x1="80" y1="330" x2="820" y2="330" stroke="#FFEDD5" stroke-dasharray="4 4"/>
  <line x1="80" y1="400" x2="820" y2="400" stroke="#E2E8F0"/>

  <!-- Impression Area + Line (Rapid 3x Scaled Slope) -->
  <path d="M 80 370 Q 240 360 400 320 T 640 210 T 820 130 L 820 400 L 80 400 Z" fill="url(#eArea)"/>
  <path d="M 80 370 Q 240 360 400 320 T 640 210 T 820 130" fill="none" stroke="url(#eLine)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Highlight Data Points -->
  <circle cx="80" cy="370" r="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/>
  <circle cx="400" cy="320" r="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/>
  <circle cx="640" cy="210" r="6" fill="#FFFFFF" stroke="#F43F5E" stroke-width="3"/>
  <circle cx="820" cy="130" r="8" fill="#F43F5E" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Callout Badge on ~3x Impressions -->
  <g transform="translate(620, 75)">
    <rect width="200" height="58" rx="12" fill="#18181B" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.15))"/>
    <text x="100" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FED7AA" text-anchor="middle">IMPRESSIONS ONLY</text>
    <text x="100" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">~3x Search Visibility</text>
  </g>

  <!-- Timeline Notes -->
  <g transform="translate(80, 420)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#52525B">Week 1-2: Audit &amp; Technical Fixes</text>
    <text x="300" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#52525B">Week 3-5: Service Page Optimization</text>
    <text x="600" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#EA580C">Week 6-8: ~3x Impression Trajectory</text>
  </g>
</svg>
